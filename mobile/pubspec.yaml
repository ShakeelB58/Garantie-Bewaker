name: garantiebewaker
description: "GarantieBewaker: bewaar aankoopbewijzen en garantiedatums lokaal op je telefoon."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.8.0

# Alleen wat echt gebruikt wordt. Notificaties volgen in fase 5.
# Dio wordt pas toegevoegd wanneer de app daadwerkelijk met de backend praat (niet nodig voor de MVP).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 3.x: actuele hoofdversie van Riverpod.
  flutter_riverpod: ^3.0.0
  # 17 werkt vanaf oudere Flutter-versies, 18 vereist Flutter 3.44+. Pub kiest automatisch.
  go_router: ">=17.0.0 <19.0.0"
  # Lokale SQLite-database (iOS en Android).
  sqflite: ^2.4.4
  # Bestandspaden samenstellen.
  path: ^1.9.0
  # UUID's voor entiteiten.
  uuid: ^4.5.0
  # Datum- en bedragnotatie. Versie wordt vastgelegd door flutter_localizations.
  intl: any
  # App-private mappen voor documentopslag.
  path_provider: ^2.1.6
  # Camera en fotobibliotheek (officieel Flutter-pakket).
  image_picker: ^1.2.4
  # PDF's en afbeeldingen kiezen uit Bestanden / Downloads.
  file_picker: ^13.1.0
  # PDF-weergave (PDFium). Ook bruikbaar voor tekstextractie in fase 4.
  pdfrx: ^2.6.5
  # Bestanden ontvangen via "Openen met" (iOS) en "Delen"/"Openen met" (Android),
  # zonder iOS Share Extension.
  open_file_handler: ^3.0.0
  # Tekstherkenning op het toestel: Apple Vision (iOS) en ML Kit (Android).
  text_sight: ^1.0.0
  # Gescande PDF-pagina's omzetten naar JPEG voor OCR (ook gebruikt door pdfrx).
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # SQLite op de computer, zodat repository-tests zonder telefoon kunnen draaien.
  sqflite_common_ffi: ^2.4.0

flutter:
  uses-material-design: true
