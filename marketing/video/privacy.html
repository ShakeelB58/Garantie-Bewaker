<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><script src="common.js"></script>
<style>
#su{left:50%;top:620px;margin-left:-330px;width:660px;padding:50px 50px 60px}
#su .tt{font-size:48px;font-weight:700;color:#111}#su .f{height:96px;border:3px solid #d6dbe1;border-radius:20px;margin-top:30px;font-size:34px;color:#8a95a2;padding:0 28px;display:flex;align-items:center}
#su .bt{margin-top:40px;height:100px;border-radius:50px;background:#3b4a5a;color:#fff;font-size:36px;font-weight:600;display:flex;align-items:center;justify-content:center}
.ad{position:absolute;width:460px;padding:30px;border-radius:28px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.ad .tag{display:inline-block;background:#F2A33A;color:#fff;font-weight:700;font-size:26px;padding:6px 18px;border-radius:12px}
.ad .x{position:absolute;right:20px;top:14px;font-size:36px;color:#999}
.ad .big{font-size:52px;font-weight:700;color:#E2574C;margin-top:18px}.ad .sm{font-size:28px;color:#555;margin-top:8px}
#pills{left:0;right:0;top:1240px;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:30}
#pills div{background:#fff;border-radius:44px;padding:20px 40px;font-weight:600;font-size:42px;color:var(--teal);box-shadow:0 12px 30px rgba(15,42,68,.15)}
</style></head><body><div id="stage">
<div id="h1" class="abs head"></div><div id="s1" class="abs sub"></div>
<div id="su" class="abs card"><div class="tt">Account aanmaken</div><div class="f">E-mailadres</div><div class="f">Wachtwoord</div><div class="f">Telefoonnummer</div><div class="bt">Registreren</div></div>
<div id="ads"></div>
<div id="ph" class="abs phone"><div class="screen"><div class="island"></div><div id="w" class="shot"><img src="a/welkom.png"></div><div id="home" class="shot"><img src="a/1-home.png"></div></div></div>
<div id="pills" class="abs"><div>🔒 Geen account</div><div>🚫 Geen reclame</div><div>📱 Alles op je eigen telefoon</div></div>
</div><script>
window.SCENES=[[0,3.3],[3.3,6.6],[6.6,10],[10,13],[13,15.5]];
addEnd('Je bonnen blijven van jou');
const H=[[0,3.3,'Weer een app met een account?','E-mail, wachtwoord, telefoonnummer…'],[3.3,6.6,'En overal reclame…',''],
 [6.6,10,'Bonvrij doet het anders','Openen en meteen beginnen'],[10,13,'Je bonnen blijven van jou','Wij krijgen niets te zien']];
const adData=[[80,560,-8,'50% KORTING!','Alleen vandaag'],[540,760,7,'WIN NU!','Klik hier'],[140,1020,4,'NIEUW!','Download nu'],[520,1260,-6,'GRATIS!','Bijna op'],[100,1450,9,'SUPER DEAL','Nu kopen']];
const ads=adData.map(([x,y,r,b,s])=>{const d=document.createElement('div');d.className='ad';d.innerHTML=`<div class="x">✕</div><div class="tag">ADVERTENTIE</div><div class="big">${b}</div><div class="sm">${s}</div>`;
 d.style.left=x+'px';d.style.top=y+'px';$('ads').appendChild(d);return {d,r};});
function render(t){heads(t,H);
 const s=win(t,0,3.6,.3,.35);$('su').style.opacity=s;$('su').style.transform=`translateY(${(1-out(lin(t,0,.6)))*90}px) rotate(${Math.sin(lin(t,1.4,2.2)*Math.PI*6)*2}deg)`;
 ads.forEach((a,i)=>{const p=lin(t,3.5+i*0.32,3.8+i*0.32);const away=ease(lin(t,6.3,6.9));
  a.d.style.opacity=p*(1-away);a.d.style.transform=`scale(${0.3+0.7*back(p)}) rotate(${a.r}deg) translateX(${away*(i%2?1300:-1300)}px)`;});
 const po=win(t,6.6,13.2,.35,.35);$('ph').style.opacity=po;$('ph').style.transform=`translateY(${(1-out(lin(t,6.6,7.2)))*700}px)`;
 $('w').style.opacity=1-lin(t,8.6,8.9);$('home').style.opacity=lin(t,8.6,8.9);
 document.querySelectorAll('#pills div').forEach((p,i)=>{const q=lin(t,10.2+i*.3,10.6+i*.3);p.style.opacity=q*(1-lin(t,12.8,13));p.style.transform=`translateY(${(1-out(q))*40}px) scale(${0.9+0.1*back(q)})`;});
 renderEnd(t,13);}
window.render=render;render(0);</script></body></html>
