<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><script src="common.js"></script>
<style>
svg#w{position:absolute;left:0;top:0;width:1080px;height:1920px}
#bubble{left:470px;top:560px;width:520px;padding:34px 30px;background:#fff;border-radius:40px;font-weight:700;font-size:52px;color:var(--navy);text-align:center;box-shadow:0 14px 40px rgba(15,42,68,.18);z-index:30}
#bubble:after{content:'';position:absolute;left:70px;bottom:-34px;border:24px solid transparent;border-top:34px solid #fff}
#found{left:50%;top:560px;margin-left:-330px;width:660px;padding:34px;display:flex;gap:26px;align-items:center;z-index:30}
#found img{width:130px;height:130px;border-radius:30px}
#found .a{font-size:40px;font-weight:700;color:var(--navy)}#found .b{font-size:32px;color:var(--teal);font-weight:600;margin-top:6px}
#found .c{font-size:26px;color:var(--muted);margin-top:4px}
</style></head><body><div id="stage">
<div id="h1" class="abs head"></div><div id="s1" class="abs sub"></div>
<svg id="w" viewBox="0 0 1080 1920">
 <g id="room">
  <rect x="0" y="1560" width="1080" height="360" fill="#DCEFEA"/>
  <rect x="0" y="1552" width="1080" height="12" fill="#B9DDD6"/>
  <rect x="110" y="690" width="230" height="300" rx="16" fill="#fff" opacity=".7"/><rect x="110" y="835" width="230" height="10" fill="#E3F4F2"/><rect x="220" y="690" width="10" height="300" fill="#E3F4F2"/>
 </g>
 <g id="tvset" transform="translate(760 1160)">
  <rect x="-60" y="300" width="300" height="100" rx="14" fill="#9C7A5B"/>
  <rect x="-140" y="40" width="460" height="270" rx="20" fill="#0F2A44"/>
  <rect id="tvscreen" x="-120" y="58" width="420" height="230" rx="10" fill="url(#g1)"/>
  <g id="tvcrack" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"><path d="M90 120 L60 170 L100 210 L40 270"/><path d="M90 120 L170 90 L250 110"/><path d="M100 210 L190 230 L280 200"/><path d="M60 170 L-40 160 L-100 200"/></g>
  <g id="smoke" fill="#9aa5b1"><circle cx="40" cy="20" r="30"/><circle cx="90" cy="0" r="40"/><circle cx="150" cy="15" r="28"/></g>
 </g>
 <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FA9F5"/><stop offset=".5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#F2A33A"/></linearGradient></defs>
 <g id="drawer" transform="translate(150 1250)">
  <rect x="0" y="0" width="420" height="300" rx="16" fill="#9C7A5B"/><rect x="20" y="20" width="380" height="110" rx="10" fill="#7C6049"/><rect x="170" y="70" width="80" height="18" rx="9" fill="#6E553F"/>
  <rect x="20" y="160" width="380" height="110" rx="10" fill="#8A6B4F"/><rect x="170" y="205" width="80" height="18" rx="9" fill="#6E553F"/>
 </g>
 <g id="papers"></g>
 <g id="people"></g>
 <g id="counter" transform="translate(0 1180)">
  <rect x="560" y="120" width="520" height="260" rx="18" fill="#0F2A44"/><rect x="540" y="100" width="560" height="40" rx="14" fill="#1E4466"/>
  <rect x="640" y="-440" width="320" height="90" rx="20" fill="#0B7A75"/><text x="800" y="-380" text-anchor="middle" font-family="P" font-weight="700" font-size="46" fill="#fff">SERVICE</text>
 </g>
 <g id="box"><rect x="-130" y="-110" width="260" height="190" rx="12" fill="#C99A6B"/><rect x="-130" y="-110" width="260" height="34" fill="#B58757"/><text x="0" y="30" text-anchor="middle" font-family="P" font-weight="700" font-size="64" fill="#7A5634">TV</text></g>
 <g id="phoneS"><rect x="-38" y="-70" width="76" height="140" rx="16" fill="#0F2A44"/><rect x="-30" y="-60" width="60" height="120" rx="10" fill="#CDEFEC"/><circle id="glow" cx="0" cy="0" r="120" fill="#3FE0D0" opacity=".25"/></g>
 <g id="drops" fill="#6EC3F0"><path d="M0 0 C -14 22 -14 38 0 40 C 14 38 14 22 0 0Z"/></g>
</svg>
<div id="bubble" class="abs">Waar is die bon?! 😩</div>
<div id="found" class="abs card"><img src="a/icoon-512.png"><div><div class="a">Televisie</div><div class="b">✓ Garantie tot juli 2028</div><div class="c">Kassabon bewaard · Elektro Noord</div></div></div>
</div><script>
window.SCENES=[[0,4],[4,7.6],[7.6,11.2],[11.2,15],[15,18],[18,20.5]];
addEnd('Nooit meer zoeken naar je bon');
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;}
function person(id,shirt,hair,pants){const g=el('g',{id},$('people'));
 const legL=el('g',{},g),legR=el('g',{},g);
 for(const [lg,x] of [[legL,-34],[legR,34]]){lg.dataset.x=x;el('line',{x1:x,y1:-190,x2:x,y2:-20,stroke:pants,'stroke-width':48,'stroke-linecap':'round'},lg);el('ellipse',{cx:x+12,cy:-8,rx:40,ry:20,fill:'#26323f'},lg);}
 el('rect',{x:-88,y:-440,width:176,height:280,rx:64,fill:shirt},g);
 const armL=el('g',{},g),armR=el('g',{},g);
 for(const [ag,x] of [[armL,-78],[armR,78]]){ag.dataset.x=x;el('line',{x1:x,y1:-400,x2:x,y2:-250,stroke:shirt,'stroke-width':44,'stroke-linecap':'round'},ag);el('circle',{cx:x,cy:-232,r:26,fill:'#F2C9A0'},ag);}
 const head=el('g',{},g);
 el('circle',{cx:0,cy:-545,r:100,fill:'#F2C9A0'},head);
 el('path',{d:'M-100 -560 C -100 -680 100 -680 100 -560 C 70 -610 -40 -630 -100 -560Z',fill:hair},head);
 el('circle',{cx:-34,cy:-548,r:11,fill:'#1d2733'},head);el('circle',{cx:34,cy:-548,r:11,fill:'#1d2733'},head);
 el('circle',{cx:-60,cy:-515,r:14,fill:'#F4A7A0',opacity:.6},head);el('circle',{cx:60,cy:-515,r:14,fill:'#F4A7A0',opacity:.6},head);
 const smile=el('path',{d:'M-34 -500 Q0 -466 34 -500',stroke:'#1d2733','stroke-width':8,fill:'none','stroke-linecap':'round'},head);
 const oh=el('ellipse',{cx:0,cy:-490,rx:16,ry:22,fill:'#1d2733'},head);
 const sad=el('path',{d:'M-30 -480 Q0 -505 30 -480',stroke:'#1d2733','stroke-width':8,fill:'none','stroke-linecap':'round'},head);
 return {g,legL,legR,armL,armR,head,smile,oh,sad};}
const sam=person('sam','#0B7A75','#3b2a20','#0F2A44');
const clerk=person('clerk','#F2A33A','#1d2733','#4A5B6E');
function pose(p,{x=540,y=1560,s=1,legL=0,legR=0,armL=0,armR=0,mouth='smile',head=0,o=1}){
 p.g.setAttribute('transform',`translate(${x} ${y}) scale(${s})`);p.g.setAttribute('opacity',o);
 p.legL.setAttribute('transform',`rotate(${legL} ${p.legL.dataset.x} -190)`);p.legR.setAttribute('transform',`rotate(${legR} ${p.legR.dataset.x} -190)`);
 p.armL.setAttribute('transform',`rotate(${armL} ${p.armL.dataset.x} -400)`);p.armR.setAttribute('transform',`rotate(${armR} ${p.armR.dataset.x} -400)`);
 p.head.setAttribute('transform',`rotate(${head} 0 -545)`);
 p.smile.setAttribute('opacity',mouth=='smile'?1:0);p.oh.setAttribute('opacity',mouth=='oh'?1:0);p.sad.setAttribute('opacity',mouth=='sad'?1:0);}
const papers=[];for(let i=0;i<10;i++){const r=el('rect',{width:80,height:110,rx:6,fill:'#fff',stroke:'#d9dde2','stroke-width':3},$('papers'));papers.push({r,a:-0.9+i*0.2,s:500+(i%4)*90});}
const H=[[0,4,'Sam koopt een nieuwe tv','Blij! 📺'],[4,7.6,'8 maanden later…','De tv doet het niet meer'],[7.6,11.2,'Garantie! Maar…',''],
 [11.2,15,'Gelukkig: Bonvrij','De bon staat gewoon op z\'n telefoon'],[15,18,'Geregeld. 😎','Nieuwe tv onder garantie']];
const show=(id,o)=>$(id).setAttribute('opacity',o);
function render(t){heads(t,H);
 const sc=t<4?0:t<7.6?1:t<11.2?2:t<15?3:4;
 // room elements per scene
 show('tvset',win(t,4,7.6,.3,.3));show('drawer',win(t,7.6,11.2,.3,.3));show('counter',win(t,15,18.2,.3,.3));
 show('room',1-lin(t,18,18.3));
 // TV state
 const broke=lin(t,5.2,5.4);$('tvscreen').setAttribute('fill',broke>0.5?'#111':'url(#g1)');show('tvcrack',broke);
 const sm=lin(t,5.3,7.4);$('smoke').setAttribute('transform',`translate(0 ${-sm*160}) scale(${1+sm*0.6})`);show('smoke',(t>5.3&&t<7.5)?(1-sm)*0.9:0);
 // box
 let boxO=0,bx=0,by=0;
 // sam per scene
 if(sc==0){const wx=-200+out(lin(t,0,2.6))*640;const w=Math.sin(t*9)*(1-lin(t,2.4,2.8));
  pose(sam,{x:wx,legL:w*18,legR:-w*18,armL:-38,armR:38,mouth:'smile',head:Math.sin(t*4)*3});boxO=win(t,0,4,.01,.3);bx=wx;by=1560-330;
  sam.g.setAttribute('opacity',win(t,0,4,.01,.3));}
 else if(sc==1){const shock=lin(t,5.3,5.6);pose(sam,{x:330,armL:shock*-150,armR:shock*150,mouth:shock>0?'oh':'smile',head:Math.sin(lin(t,5.6,6.4)*Math.PI*4)*6*shock,o:win(t,4,7.6,.3,.3)});}
 else if(sc==2){const f=Math.sin(t*14);pose(sam,{x:700,armL:-60+f*40,armR:60-f*40,mouth:'sad',head:f*5,o:win(t,7.6,11.2,.3,.3)});}
 else if(sc==3){const j=Math.abs(Math.sin(lin(t,13.2,14.6)*Math.PI*2))*lin(t,13.2,13.4)*(1-lin(t,14.5,14.7));
  pose(sam,{x:540,y:1560-j*120,armL:t>13.2?150:-20,armR:-150,mouth:t>13.2?'smile':'oh',o:win(t,11.2,15,.3,.3)});
  window._jy=j*120;}
 else {pose(sam,{x:330,armL:-15,armR:t>16.4?-155:-60,mouth:'smile',o:win(t,15,18.2,.3,.3)});}
 pose(clerk,{x:820,y:1520,s:0.9,armL:t>15.6?-70:-10,armR:-10,mouth:'smile',o:sc==4?win(t,15,18.2,.3,.3):0});
 // box: scene0 carried, scene4 handed over
 if(sc==4){const h=ease(lin(t,15.6,16.4));boxO=win(t,15,18.2,.3,.3);bx=720-h*390;by=1180-h*-50;}
 $('box').setAttribute('transform',`translate(${bx} ${by})`);show('box',boxO);
 // phone in hand scene3
 const ph=lin(t,11.8,12.3);$('phoneS').setAttribute('transform',`translate(702 ${1015-(window._jy||0)+(1-out(ph))*200})`);show('phoneS',sc==3?ph*win(t,11.2,15,.3,.3):0);
 $('glow').setAttribute('r',100+Math.sin(t*6)*20);
 // papers scene2
 papers.forEach((q,i)=>{const p=lin(t,8.2+i*0.22,9.6+i*0.22);const r=out(p)*q.s;
  q.r.setAttribute('transform',`translate(${360+Math.sin(q.a)*r} ${1250-Math.cos(q.a)*r+p*p*500}) rotate(${p*400*(i%2?1:-1)})`);q.r.setAttribute('opacity',(p>0&&p<1&&t<11.2)?1-p*0.6:0);});
 // drops when shocked / searching
 const dO=(t>5.4&&t<7.4)||(t>8&&t<11)?1:0;const dx=t<7.6?330:700;$('drops').setAttribute('transform',`translate(${dx+115} ${1560-640+((t*3)%1)*40})`);show('drops',dO);
 const b=lin(t,8.0,8.35);$('bubble').style.opacity=b*(1-lin(t,10.9,11.2));$('bubble').style.transform=`scale(${0.6+0.4*back(b)})`;
 const fo=lin(t,12.4,12.8);$('found').style.opacity=fo*(1-lin(t,14.7,15));$('found').style.transform=`scale(${0.8+0.2*back(fo)})`;
 renderEnd(t,18);}
window.render=render;render(0);</script></body></html>
