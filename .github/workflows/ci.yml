# Automatische controle bij elke push: dezelfde opdrachten die je lokaal
# draait. Gebruikt geen geheimen en geen echte gegevens.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    name: Flutter (analyse en tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Afhankelijkheden
        run: flutter pub get
      - name: Opmaak (dart format)
        # Meldt bestanden die anders opgemaakt moeten worden, zonder de
        # build te laten mislukken.
        continue-on-error: true
        run: |
          changed=$(dart format --output=none lib test | grep '^Changed' || true)
          if [ -n "$changed" ]; then
            echo "::warning title=Opmaak::$(echo "$changed" | sed 's/^Changed //' | tr '\n' ' ')"
            exit 1
          fi
      - name: Statische analyse
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          if [ $status -ne 0 ]; then
            msg=$(grep -E ' • ' analyze.txt | head -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter analyze::$msg"
          fi
          exit $status
      - name: Tests
        if: always()
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          status=$?
          tail -n 5 test.txt
          if [ $status -ne 0 ]; then
            # Alleen de mislukte tests met hun foutmelding.
            awk '/\[E\]$/{p=1} /^[0-9]+:[0-9]+ \+[0-9]+/{if(!/\[E\]$/)p=0} p' test.txt \
              | grep -v '^\s*$' | head -c 60000 > failures.txt
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' failures.txt)
            echo "::error title=flutter test::$msg"
          fi
          exit $status

  format:
    # Alleen als de commit-boodschap [format] bevat: maakt de code op met
    # dart format en zet dat als aparte commit terug op dezelfde branch.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[format]')
    name: Code opmaken (dart format)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Opmaken en terugzetten
        run: |
          cd mobile
          flutter pub get
          dart format lib test
          cd ..
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Opmaak: dart format"
          git push

  backend:
    name: Spring Boot (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Bouwen en testen (met Testcontainers/PostgreSQL)
        run: mvn -B verify
