# Automatische controle bij elke push: dezelfde opdrachten die je lokaal
# draait. Gebruikt geen geheimen en geen echte gegevens.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    name: Flutter (analyse en tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Afhankelijkheden
        run: flutter pub get
      - name: Opmaak (dart format)
        # Meldt bestanden die anders opgemaakt moeten worden, zonder de
        # build te laten mislukken.
        continue-on-error: true
        run: |
          changed=$(dart format --output=none lib test | grep '^Changed' || true)
          if [ -n "$changed" ]; then
            echo "$changed" | sed 's/^Changed /::warning title=Opmaak::Niet opgemaakt: /'
            exit 1
          fi
      - name: Statische analyse
        run: flutter analyze
      - name: Tests
        run: flutter test --reporter github

  backend:
    name: Spring Boot (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Bouwen en testen (met Testcontainers/PostgreSQL)
        run: mvn -B verify
